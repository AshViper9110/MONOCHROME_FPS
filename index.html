<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOCHROME FPS</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: 'Courier New', 'Consolas', monospace;
    user-select: none;
    font-size: 14px;
    line-height: 1.4;
}

.scene { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.scene.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* ---- TITLE ---- */
#scene-title { z-index: 1; }
#scene-title h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 400;
    letter-spacing: 0.3em;
    margin-bottom: 2em;
}
#scene-title .prompt {
    font-size: 0.85rem;
    color: #666;
    animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }

/* ---- LOBBY ---- */
#scene-lobby { z-index: 2; }
.lobby-box {
    width: min(90vw, 380px);
}
.lobby-box h2 {
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    margin-bottom: 1.5rem;
    font-weight: 400;
    color: #888;
}
.lobby-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}
.lobby-row label {
    color: #666;
    font-size: 0.8rem;
    width: 70px;
    flex-shrink: 0;
}
.lobby-row input, .lobby-row select {
    flex: 1;
    background: transparent;
    border: 1px solid #333;
    border-radius: 0;
    color: #fff;
    font-family: inherit;
    font-size: 0.85rem;
    padding: 6px 8px;
    outline: none;
}
.lobby-row input:focus { border-color: #666; }
.lobby-row select option { background: #000; color: #fff; }

.lobby-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
}
.btn {
    flex: 1;
    background: transparent;
    border: 1px solid #333;
    color: #fff;
    font-family: inherit;
    font-size: 0.8rem;
    padding: 8px 12px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: border-color 0.15s;
}
.btn:hover { border-color: #666; }
.btn:disabled { opacity: 0.3; cursor: default; }
.btn:disabled:hover { border-color: #333; }

#room-code {
    color: #fff;
    font-size: 1.2rem;
    letter-spacing: 0.3em;
    margin: 8px 0;
}

#player-list {
    margin: 12px 0;
    min-height: 40px;
}
.pl-entry {
    font-size: 0.8rem;
    color: #888;
    padding: 3px 0;
    border-bottom: 1px solid #111;
}
.pl-entry.pl-me { color: #fff; }
.lobby-empty {
    font-size: 0.75rem;
    color: #444;
    padding: 8px 0;
}

#lobby-status {
    font-size: 0.75rem;
    color: #555;
    margin: 6px 0;
    min-height: 1.2em;
}

.room-info {
    font-size: 0.75rem;
    color: #555;
    margin-top: 4px;
}

#lobby-create, #lobby-wait { display: none; }
#bot-count-row { display: none; }

/* ---- GAME ---- */
#scene-game { z-index: 3; }
#game-canvas { display: block; width: 100%; height: 100%; }

#hud {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
}
#crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1rem;
    color: rgba(255,255,255,0.5);
    font-weight: 100;
}
#health-bar {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 4px;
    background: rgba(255,255,255,0.06);
}
#health-fill {
    width: 100%; height: 100%;
    background: #fff;
    transition: width 0.1s;
}
#health-text {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: #555;
}
#kills-display {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 0.8rem;
    color: #666;
}
#kills-display #kills-count {
    color: #fff;
}
#timer {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    color: #555;
}
#kill-feed {
    position: absolute;
    bottom: 50px;
    left: 16px;
    font-size: 0.75rem;
    color: #666;
}
.kf-item {
    margin-bottom: 2px;
    opacity: 1;
}
#minimap {
    position: absolute;
    bottom: 12px;
    left: 12px;
    width: 140px; height: 140px;
    border: 1px solid rgba(255,255,255,0.06);
    image-rendering: pixelated;
}
#scoreboard {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
}
#scoreboard.active { display: flex; }
#scoreboard-content { min-width: 260px; text-align: center; }
#scoreboard-content h2 {
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    margin-bottom: 1rem;
    color: #888;
}
.sb-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 12px;
    font-size: 0.8rem;
    color: #888;
    border-bottom: 1px solid #111;
}
.sb-row.sb-me { color: #fff; }

#death-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.03);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#death-screen.active { display: flex; }
#death-screen h2 {
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: #666;
    margin-bottom: 0.5em;
}
#death-screen p { font-size: 0.8rem; color: #444; }

#game-over {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#game-over.active { display: flex; }
#game-over h2 {
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: #fff;
    margin-bottom: 1.5rem;
}
.go-row {
    display: flex;
    gap: 16px;
    padding: 4px 0;
    font-size: 0.8rem;
    color: #888;
    border-bottom: 1px solid #111;
    min-width: 220px;
    justify-content: center;
}
.go-row.go-me { color: #fff; }
#game-over .prompt {
    margin-top: 2rem;
    font-size: 0.75rem;
    color: #444;
    animation: blink 1.5s ease-in-out infinite;
}
</style>
</head>
<body>

<!-- TITLE -->
<div id="scene-title" class="scene">
    <h1>MONOCHROME FPS</h1>
    <p class="prompt">PRESS ENTER</p>
</div>

<!-- LOBBY -->
<div id="scene-lobby" class="scene">
    <div class="lobby-box">
        <h2>// LOBBY</h2>
        <div id="lobby-connect">
            <div class="lobby-row">
                <label>NAME</label>
                <input type="text" id="pname" maxlength="10" value="PLAYER">
            </div>
            <div class="lobby-actions">
                <button id="btn-create" class="btn">CREATE</button>
                <button id="btn-join" class="btn">JOIN</button>
            </div>
            <div class="lobby-row" style="margin-top:10px">
                <label>ROOM</label>
                <input type="text" id="room-input" maxlength="6" placeholder="XXXX" style="text-transform:uppercase">
            </div>
        </div>

        <div id="lobby-create">
            <div class="room-info">ROOM CODE</div>
            <div id="room-code">----</div>
            <div class="lobby-row" style="margin-top:10px">
                <label>BOTS</label>
                <select id="bot-count">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <button id="btn-start-game" class="btn">START</button>
        </div>

        <div id="lobby-wait">
            <div class="room-info">CONNECTED</div>
        </div>

        <div id="player-list"></div>
        <div id="lobby-status"></div>
    </div>
</div>

<!-- GAME -->
<div id="scene-game" class="scene">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <div id="crosshair">+</div>
        <div id="health-bar"><div id="health-fill"></div><span id="health-text">100</span></div>
        <div id="kills-display">KILLS <span id="kills-count">0</span></div>
        <div id="timer">3:00</div>
        <div id="kill-feed"></div>
        <canvas id="minimap"></canvas>
        <div id="scoreboard"><div id="scoreboard-content"></div></div>
    </div>

    <div id="death-screen">
        <h2>YOU DIED</h2>
        <p>RESPAWN IN <span id="respawn-timer">3</span></p>
    </div>

    <div id="game-over">
        <h2>GAME OVER</h2>
        <div id="final-scores"></div>
        <p class="prompt">PRESS ENTER</p>
    </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
